# solve the issue of new tabs create dead space in tiling layout by first opening 
# app in floating mode, then switching to tiling using first tab of apps.

# [[on-window-detected]]
# if.window-title-regex-substring = '^(|Untitled|New Tab|New Window)$'
# check-further-callbacks = true
# run = 'layout tiling'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = ['layout accordion', 'move-node-to-workspace 1']

[[on-window-detected]] 
if.app-name-regex-substring = '^(Antigravity IDE)$' 
run = ['layout accordion', 'move-node-to-workspace 1']

[[on-window-detected]]
if.app-name-regex-substring = '^(Ghostty)'
run = ['layout floating', 'move-node-to-workspace 2']

[[on-window-detected]]
if.app-name-regex-substring = '^(Music)$'
run = ['layout tiling', 'move-node-to-workspace 9']

[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = ['layout tiling', 'move-node-to-workspace 0']

[[on-window-detected]]
if.app-name-regex-substring = '^(Zen|Arc|Comet|Dia|ChatGPT Atlas)$'
run = ['layout accordion', 'move-node-to-workspace 3']

[[on-window-detected]]
if.app-name-regex-substring = '^(Claude|ChatGPT)$'
run = ['layout tiling', 'move-node-to-workspace 4']

# Default catch-all: float every new window unless a rule above handles it
# Add fullscreen exceptions above this block (e.g., run = ['focus', 'fullscreen'])
[[on-window-detected]]
run = 'layout floating'

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'


# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors                                                                     
[gaps]
inner.horizontal = 1
inner.vertical = 1
outer.left = 1
outer.bottom = 1
outer.top = [{ monitor."^built-in retina display$" = 3 }, 42]
outer.right = 1

