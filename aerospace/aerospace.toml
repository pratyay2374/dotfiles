# outer.top = 0
# outer.right = 3


# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}

[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
# You can uncomment the following lines to open up terminal with alt + enter shortcut (like in i3)
# alt-enter = '''exec-and-forget osascript -e '
# tell application "Terminal"
#     do script
#     activate
# end tell'
# '''

alt-shift-f = 'fullscreen'
alt-f = 'layout floating tiling'

alt-shift-left = 'join-with left'
alt-shift-down = 'join-with down'
alt-shift-up = 'join-with up'
alt-shift-right = 'join-with right'

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Cycle windows in current workspace (all windows: tiling + floating, deterministic order)
alt-backtick = 'exec-and-forget ~/.config/sketchybar/helpers/cycle_windows.sh next'
alt-shift-backtick = 'exec-and-forget ~/.config/sketchybar/helpers/cycle_windows.sh prev'

# Cycle workspaces on current monitor (wrap around)
alt-tab = 'workspace-back-and-forth'
# Toggle between accordion pages (full-screen ↔ split view)
alt-quote = '''exec-and-forget /bin/bash -c '
  FOCUSED=$(aerospace list-windows --focused --format "%{window-id}")
  FIRST=$(aerospace list-windows --workspace focused --format "%{window-id}" | head -1)
  if [ "$FOCUSED" = "$FIRST" ]; then
    aerospace focus dfs-next --boundaries-action wrap-around-the-workspace
  else
    while true; do
      aerospace focus dfs-prev --boundaries-action wrap-around-the-workspace
      NOW=$(aerospace list-windows --focused --format "%{window-id}")
      if [ "$NOW" = "$FIRST" ] || [ "$NOW" = "$FOCUSED" ]; then break; fi
      FOCUSED="$NOW"
    done
  fi
' '''
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'


# See: https://nikitabobko.github.io/AeroSpace/commands#move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 0'

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'
alt-shift-0 = 'move-node-to-workspace 0 --focus-follows-window'


# See: https://nikitabobko.github.io/AeroSpace/commands#mode
alt-shift-s = ['mode service', 'exec-and-forget sketchybar --trigger aerospace_enter_service_mode']
# alt-shift-a = 'mode apps'

# Application launchers
alt-v = 'exec-and-forget open -a "/Applications/Visual Studio Code.app"'
alt-w = 'exec-and-forget open -a /Applications/WhatsApp.app'
alt-c = 'exec-and-forget open -a /Applications/Google\ Chrome.app'
# alt-f = 'exec-and-forget open -a /System/Library/CoreServices/Finder.app'
# alt-e = 'exec-and-forget open -a "/Applications/Final Cut Pro.app"'
alt-a = 'exec-and-forget open -a /Applications/Antigravity.app'
alt-g = 'exec-and-forget open -a /Applications/Ghostty.app'
alt-m = 'exec-and-forget open -a "Music"'
alt-i = 'exec-and-forget open -a /System/Applications/iPhone\ Mirroring.app'
alt-z = 'exec-and-forget open -a /Applications/Zen.app'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes

[mode.service.binding]
esc = ['reload-config', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_leave_service_mode']
r = ['flatten-workspace-tree', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_leave_service_mode'] # reset layout
f = [
  'layout floating tiling',
  'mode main',
  'exec-and-forget sketchybar --trigger aerospace_leave_service_mode'
] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_leave_service_mode']
alt-f = ['flatten-workspace-tree', 'balance-sizes', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_leave_service_mode']                           

[mode.apps.binding]
alt-w = ['exec-and-forget open -a /Applications/WezTerm.app', 'mode main']
esc = ['mode main', 'exec-and-forget sketchybar --trigger aerospace_leave_service_mode']


[workspace-to-monitor-force-assignment]
1 = '^Built-in.*$'
2 = '^DELL U.*$'
3 = '^DELL S.*$'
#     4 = '^dell$'
#     5 = 'main'
#     6 = '^elgato$'


# Common Alternatives

# Layout: change/toggle how the window is managed
#     layout tiling: tile the window
#     layout floating: float the window
#     layout tiles: switch to tiles (preserve orientation)
#     layout accordion: switch to accordion (stack/tab; preserve orientation)
#     layout tiles horizontal vertical: toggle tiles + orientation
#     layout accordion horizontal vertical: toggle accordion + orientation
#     layout v_accordion: vertical stacked
#     layout h_accordion: horizontal tabbed
#     layout floating tiling: toggle floating ↔ tiling

# Fullscreen variants: non-native and native
#     fullscreen on / fullscreen off / fullscreen --no-outer-gaps
#     macos-native-fullscreen on / macos-native-fullscreen off

# Workspace/monitor actions: place windows where you want
#     move-node-to-workspace <name>
#     workspace <name>
#     move-node-to-monitor (left|down|up|right|next|prev) or <monitor-pattern>
#     move-workspace-to-monitor (left|down|up|right|next|prev) or <monitor-pattern>

# Focus/navigation: select the window to operate on
#     focus left|down|up|right
#     focus dfs-next|dfs-prev (depth-first order), optional --boundaries-action wrap-around-the-workspace
#     focus --window-id <window-id>

# Resize/arrange: tweak size and tree
#     resize smart +/-<number> or resize width|height +/-<number>
#     balance-sizes
#     join-with left|down|up|right
#     split horizontal|vertical|opposite
#     flatten-workspace-tree

# Misc automation
#     swap left|down|up|right|dfs-next|dfs-prev
#     enable on|off|toggle
#     macos-native-minimize
#     reload-config
#     exec-and-forget <bash-script>

# Examples

#     Tile and stack (vertical accordion) instead of fullscreen:
#         run = ['layout v_accordion']
#     Tile and maximize-like (accordion monocle style works best with low padding):
#         run = ['layout v_accordion'] and set accordion-padding = 0 in config
#     Float this app:
#         run = ['layout floating']
#     Send to a workspace:
#         run = ['move-node-to-workspace W']
#     Native macOS fullscreen instead:
#         run = ['layout tiling', 'macos-native-fullscreen on']
#     Fullscreen without outer gaps:
#         run = ['layout tiling', 'fullscreen --no-outer-gaps']
